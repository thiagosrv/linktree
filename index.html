<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="PS Proteção Segurança — Links oficiais">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>PS PROTEÇÃO SEGURANÇA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    /* ─── Reset ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Tokens ─────────────────────────────────────────────────────── */
    :root {
      --accent:        #FEBE00;
      --accent-dark:   #E5AB00;
      --accent-glow:   rgba(254, 190, 0, 0.40);
      --navy:          #1B2A7A;
      --navy-deep:     #152268;
      --text:          #1A1A1A;
      --muted:         #777777;
      --border:        #EEEEEE;
      --bg-page:       #ECEEF1;
      --bg-card:       #FFFFFF;

      --r-card:        20px;
      --r-btn:         12px;
      --r-full:        9999px;

      --shadow-card:   0 8px 40px rgba(0,0,0,0.10);
      --shadow-avatar: 0 4px 20px rgba(0,0,0,0.22);
      --shadow-btn:    0 8px 24px var(--accent-glow);

      --t:             all 0.22s ease;
      --font:          'Outfit', system-ui, sans-serif;

      --hero-h:        172px;
      --avatar-size:   108px;
      --avatar-peek:   52px;   /* how much avatar sticks below hero */
    }

    /* ─── Base ───────────────────────────────────────────────────────── */
    html { overflow-x: hidden; width: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg-page);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 28px 16px 44px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Animações ──────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: translateX(-50%) scale(0.82); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    /* ─── Card ───────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border-radius: var(--r-card);
      box-shadow: var(--shadow-card);
      width: 100%;
      max-width: 480px;
      overflow: visible;      /* avatar pode sobresair */
      animation: fadeIn 0.35s ease both;
    }

    /* ─── Hero (capa) ────────────────────────────────────────────────── */
    .hero-wrap {
      position: relative;
      width: 100%;
      /* espaço abaixo = parte que o avatar sobressai */
      padding-bottom: var(--avatar-peek);
    }

    .hero {
      width: 100%;
      height: var(--hero-h);
      border-radius: var(--r-card) var(--r-card) 0 0;
      overflow: hidden;
      position: relative;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Gradiente sutil na base do hero para destacar o avatar */
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60%;
      background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.28) 100%);
      pointer-events: none;
    }

    /* ─── Avatar (logo sobre a capa) ─────────────────────────────────── */
    .avatar {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--bg-card);
      /* anel dourado externo */
      box-shadow:
        0 0 0 3px var(--accent),
        var(--shadow-avatar);
      background: var(--accent);
      z-index: 10;
      animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      color: var(--navy);
    }

    /* ─── Corpo do card ──────────────────────────────────────────────── */
    .card-body {
      padding: 14px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── Nome ───────────────────────────────────────────────────────── */
    .brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 4px;
      animation: fadeIn 0.45s ease 0.3s both;
    }

    /* ─── Handle ─────────────────────────────────────────────────────── */
    .brand-handle {
      font-size: 0.83rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
      animation: fadeIn 0.45s ease 0.36s both;
    }

    /* ─── Ícones Sociais ──────────────────────────────────────────────── */
    .socials {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      animation: fadeIn 0.45s ease 0.42s both;
    }

    .socials a {
      color: var(--navy);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      text-decoration: none;
      transition: var(--t);
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: var(--accent);
      background: rgba(254, 190, 0, 0.12);
      outline: none;
    }

    /* ─── Divisor ────────────────────────────────────────────────────── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 20px;
      animation: fadeIn 0.4s ease 0.46s both;
    }

    /* ─── Botões ─────────────────────────────────────────────────────── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: var(--navy);
      border-radius: var(--r-btn);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.01em;
      border: none;
      cursor: pointer;
      transition: var(--t);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.45s ease forwards;
    }

    .btn:nth-child(1) { animation-delay: 0.50s; }
    .btn:nth-child(2) { animation-delay: 0.58s; }
    .btn:nth-child(3) { animation-delay: 0.66s; }
    .btn:nth-child(4) { animation-delay: 0.74s; }
    .btn:nth-child(5) { animation-delay: 0.82s; }
    .btn:nth-child(6) { animation-delay: 0.90s; }
    .btn:nth-child(7) { animation-delay: 0.98s; }
    .btn:nth-child(8) { animation-delay: 1.06s; }

    /* brilho interno */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
      border-radius: inherit;
      pointer-events: none;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px);
      box-shadow: var(--shadow-btn);
      background: linear-gradient(135deg, #FFD030 0%, var(--accent) 100%);
      color: var(--navy-deep);
      outline: none;
    }

    .btn:active {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* ─── Botão navy (E-Book) ────────────────────────────────────────── */
    .btn--special {
      background: linear-gradient(135deg, var(--navy) 0%, #243494 100%);
      color: var(--accent);
    }

    .btn--special::before {
      background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, transparent 60%);
    }

    .btn--special:hover,
    .btn--special:focus-visible {
      background: linear-gradient(135deg, #243494 0%, #2e44b8 100%);
      color: #FFD030;
      box-shadow: 0 8px 24px rgba(27,42,122,0.35);
    }

    .btn--special:hover .badge,
    .btn--special:focus-visible .badge { background: #FFD030; }

    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--accent);
      color: var(--navy);
      font-size: 0.60rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      padding: 2px 7px;
      border-radius: var(--r-full);
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ─── Rodapé ─────────────────────────────────────────────────────── */
    footer {
      margin-top: 24px;
      font-size: 0.76rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      animation: fadeIn 0.4s ease 1.2s both;
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--navy); text-decoration: underline; }

    /* ─── Mobile ─────────────────────────────────────────────────────── */
    @media (max-width: 430px) {
      body { padding: 0 0 36px; }

      .card {
        border-radius: 0;
        box-shadow: none;
        max-width: 100%;
      }

      .hero { border-radius: 0; }

      :root {
        --hero-h:      148px;
        --avatar-size: 96px;
        --avatar-peek: 48px;
      }

      .card-body { padding: 12px 18px 28px; }

      .brand-name { font-size: 1.05rem; }

      .btn {
        font-size: 0.875rem;
        padding: 14px 16px;
      }
    }

    /* ─── Movimento reduzido ─────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        opacity: 1 !important;
        transform: translateX(-50%) !important; /* preserva centralização do avatar */
        transition: none !important;
      }

      .btn { transform: none !important; }
    }
  </style>
</head>
